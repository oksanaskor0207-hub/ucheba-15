<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Учебный сайт - Предобучение 15</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    color: #eee;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
  }
  .card { max-width: 520px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 20px; padding: 48px 36px; }
  h1 { font-size: 28px; margin-bottom: 14px; }
  p { color: #a9b3c9; line-height: 1.6; margin-bottom: 10px; }
  .tag { display: inline-block; background: #7c5cff; color: #fff; padding: 6px 16px; border-radius: 999px; font-size: 13px; font-weight: 600; margin-top: 12px; }
</style>
</head>
<body>
  <div class="card">
    <h1>Мой первый сайт в интернете</h1>
    <p>Это учебная страница по уроку 15 «GitHub» курса «Вайб-сайты».</p>
    <p>Скоро она будет жить на настоящем адресе - через цепочку GitHub → Vercel.</p>
    <span class="tag">Ученица: Оксана</span>
  </div>
</body>
</html>
